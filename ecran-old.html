<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Step">

<title>Cycle step</title>
<!-- Page FABRIQUÉE par mon-eps/atelier/ecran-de-cours/construire.py : ne pas la modifier à la main ici.
     Moteur commun : ecran.js et ecran.css. Propre à l'activité : le <style> et le <script> ci-dessous. -->
<link rel="stylesheet" href="ecran.css">
<style>
/* ===== Propre au cycle step : couleurs, niveaux, schémas ===== */
:root{--sol:#ECEFEE; --craie:#FFFFFF; --encre:#172033; --repere:#5A6475; --trait:#D5DBDD;
  --ligne:#7C3AED; --ligne-fonce:#5B21B6; --ligne-pale:#EDE4FD;
  --vert:#1D6B3A; --vert-pale:#E6F3EA; --alerte:#B42318; --alerte-pale:#FDE8E6;
  --facile:#2F6FB0; --facile-pale:#EAF2FB; --dur:#B4441C; --dur-pale:#FCEDE6;
  --d:"Archivo","Arial Narrow",Arial,sans-serif; --t:"Atkinson","Segoe UI",Roboto,Arial,sans-serif;
  --sur-encre:#FFFFFF; --fait:#9AA3AE;
  --c-s:#0F766E; --c-s-pale:#DDF3F0; --sur-niv:#FFFFFF;}
body.niv-s{--niv:var(--c-s);--niv-pale:var(--c-s-pale)}
:root[data-theme="dark"]{
  --sol:#11161D; --craie:#1B222C; --encre:#E9EEF3; --repere:#9AA5B3; --trait:#323C49; --sur-encre:#11161D; --fait:#5B6573;
  --ligne:#A78BFA; --ligne-fonce:#C4B5FD; --ligne-pale:#2A1F45;
  --vert:#6FD39F; --vert-pale:#15301F; --alerte:#FF8A80; --alerte-pale:#3A1A18;
  --facile:#7FB0E8; --facile-pale:#162638; --dur:#F29470; --dur-pale:#3A2018;
  --c-s:#5EEAD4; --c-s-pale:#123A36; --sur-niv:#11161D; color-scheme:dark}
.schema{background:#EEF1F0;border-radius:14px;padding:8px;color:#172033}
.c-gym{fill:#EEF1F0}
.c-gymline{stroke:#C9D0D3;stroke-width:2;fill:none}
.c-floor{fill:#FFFFFF}
.c-line{stroke:#F2A900;stroke-width:5;fill:none}
.c-att{stroke:#F2A900;stroke-width:3;fill:none}
.c-net{stroke:#172033;stroke-width:6}
.c-zone{fill:#F2A900;fill-opacity:.22;stroke:#8A5A00;stroke-width:1.5;stroke-dasharray:6 4}
.c-zonet{fill:#8A5A00;font:700 max(13px,var(--fs-min,15px)) var(--t)}
.c-target{fill:#F2A900;fill-opacity:.3;stroke:#8A5A00;stroke-width:1.5}
.c-cone{fill:#E8590C}
.c-pa{fill:#2F6FB0}
.c-pb{fill:#C2410C}
.c-pn{fill:#5A6475}
.c-pt{fill:#fff;font:800 16px var(--d);text-anchor:middle;dominant-baseline:central}
.c-ball{stroke:#172033;stroke-width:2.5;stroke-dasharray:8 5;fill:none}
.c-run{stroke:#172033;stroke-width:3;fill:none}
.c-head-b,.c-head-r{fill:#172033}
.c-label{fill:#172033;font:700 max(13px,var(--fs-min,15px)) var(--t);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.c-say{fill:#172033;font:italic 700 max(13px,var(--fs-min,15px)) var(--t);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.c-shadow{fill:#172033;fill-opacity:.07}
.c-ordre circle{fill:#F2A900;stroke:#fff;stroke-width:2}
.c-ordre text{fill:#172033;font:800 15px var(--d);text-anchor:middle;dominant-baseline:central}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 4px 0;font-size:max(14px,var(--fs-min,15px));color:var(--repere)}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{display:inline-block;flex:none}
.legende .rond{width:14px;height:14px;border-radius:50%}
.legende .pt{width:24px;border-top:2.5px dashed currentColor}
.legende .tr{width:24px;border-top:3px solid currentColor}
.legende .num{width:18px;height:18px;border-radius:50%;background:#F2A900;color:#172033;font:800 max(12px,var(--fs-min,15px))/18px var(--d);text-align:center;font-style:normal}
.schema-step{background:#fff;border-radius:14px;padding:10px;color:#172033;--chip:#EEF1F5;--line:#D9DEE5;--muted:#5B6675;--accent:#7C3AED;--surface:#fff;font-family:var(--t)}
.schema-step svg{max-width:100%;height:auto;display:block;margin:0 auto}
.sv-step{fill:var(--chip);stroke:var(--muted);stroke-width:1.2}
.sv-step.off{opacity:.35}
.sv-zone{fill:none;stroke:var(--line);stroke-width:1.5}
.sv-prof{fill:var(--accent)}
.sv-lw{fill:#fff;font-size:max(8px,var(--fs-min,15px));font-weight:600}
.sv-l{fill:currentColor;font-size:max(8px,var(--fs-min,15px))}
.sv-b{font-size:max(13px,var(--fs-min,15px));font-weight:700}
.sv-ar{fill:none;stroke:var(--muted);stroke-width:1.5}
.sv-dim{stroke:var(--muted);stroke-dasharray:3 2}
.sv-cell{fill:var(--chip);stroke:var(--line)}
.minipas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.minipas svg{width:100%}
.minipas figure{margin:0;text-align:center}
.minipas figcaption{font-size:max(14px,var(--fs-min,15px));font-weight:700}
.bloc{border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0;background:#fff}
.bloc-h{font-weight:700;margin-bottom:6px;font-size:15px}
.bloc .muted,.bloc .small{color:var(--muted);font-size:max(13px,var(--fs-min,15px))}
.phr{display:flex;flex-wrap:wrap;gap:5px}
.ph{flex:1 1 40%;border-left:4px solid var(--fc);background:var(--chip);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;min-width:0;font-size:max(14px,var(--fs-min,15px))}
.ph b{font-size:max(12px,var(--fs-min,15px));color:var(--muted)}
.ph small{color:var(--muted);font-size:max(12px,var(--fs-min,15px))}
.defi{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--ligne-pale);font-size:17px}
.defi b{color:var(--ligne-fonce)}
.bpm{display:inline-block;margin-left:6px;font:700 max(13px,var(--fs-min,15px)) var(--t);padding:2px 8px;border-radius:6px;background:var(--sol);color:var(--repere)}
.cy button[data-cy=p].on{background:var(--c-p);color:var(--sur-niv)}
.pc.niv-p .sc.jour{outline-color:var(--c-p)}
.pc.niv-p{--nivp:var(--c-p)}
</style>
<style>/* Lisibilité terrain : textes à 15 px minimum à l'écran ; tailles d'origine à l'impression. */@media print{:root{--fs-min:0px}}</style>
</head>
<body>
<header class="barre">
  <img src="icon-192.png" alt="">
  <div class="app">Step<small>Lycée Pompidou</small></div>
  <span class="pastille-niv" id="cyPast">2de</span>
  <div class="titre" id="titre"></div>
  <a class="bt clair" href="https://yannickdartois-hue.github.io/Carnet-Step-/">Carnet élève</a>
  <a class="bt clair" id="prep" href="cycle-step-old.html">Préparer</a>
</header>
<div class="trace"></div>
<div class="niveau" id="niveau"></div>
<section class="deroule" id="deroule" aria-label="Déroulé de la séance"></section>
<main class="zone" id="zone"></main>
<footer class="pouce">
  <button class="bt bord" id="btSeances" type="button">‹ Séances</button>
  <button class="bt bord" id="btOutils" type="button">Outils</button>
  <button class="bt bord" id="btAjuster" type="button">Ajuster le déroulé</button>
  <div class="info" id="info"></div>
</footer>
<div id="couche"></div>

<script src="step-donnees.js"></script>
<script>
'use strict';
/* Écran de cours — step : ce qui est propre à l'activité.
   Source : mon-eps/atelier/ecran-de-cours/apps/. Le moteur commun est ecran.js. */
/* Le cycle de step tient en un niveau (Seconde). Chaque séance garde son déroulé (tl) et ses fiches. */
const court1=t=>String(t||'').split(/\s:\s|\s·\s/)[0];
const conv=f=>({t:f.titre,k:f.cat,disp:f.dispo,four:f.roles,deroul:f.deroul||[],cons:f.crit?[f.crit]:[],reus:f.reussite,moins:f.moins,plus:f.plus,spec:f.schema,defi:f.defi});
const STEP=SEANCES.map(S=>({id:S.id.toLowerCase(),n:S.id,title:S.titre,short:court1(S.titre),obj:S.obj,bpm:S.bpm,pas:S.pas,prepare:S.prepare||[],accueil:S.accueil,install:S.install,
  tl:S.tl.map(t=>[t[0],String(t[1]),t[2]]),ex:S.fiches.map(conv),evalPage:false,status:/^Évaluation/.test(S.titre)?'eval':''}));
const APP={
  old:'cycle-step-old.html',
  cle:'st',
  niv:{s:{label:'Seconde',court:'2de',long:'SECONDE',L:STEP}},
  defaut:'s',
  lienOld:()=>APP.old,
  lireCur(){const j=lire('step2de_jour',-1);return {s:j>=0&&STEP[j]?STEP[j].id:''}},
  marquerJour(c,id){const j=STEP.findIndex(s=>s.id===id);if(j<0)return;ecrire('step2de_jour',j);CUR.s=id},
  outils:[{"titre": "Pendant le cours", "items": [["chrono", "Chrono", "blocs et musique"], ["echauff", "Échauffements", "fiches"], ["pas", "16 pas", "fiches des pas"], ["blocs", "Blocs et curseurs", "construire un bloc"]]}, {"titre": "Adapter", "items": [["fc", "Filières et FC", "calcul des fréquences"], ["banque", "Banque", "exercices de rechange"], ["diff", "Différenciation", "par niveau"], ["defis", "Défis", "pour relancer"]]}, {"titre": "Évaluer", "items": [["eval", "Évaluation", "barème et grille"], ["carnet", "Carnet", "suivi des élèves"], ["reperes", "Repères et sources", "pour préparer"]]}],
  urlOutil:id=>APP.old+'#tab-'+id,
  racc:[[/^ech$/,'echauff','Fiches d’échauffement'],[/filière|fréquence cardiaque|\bFC\b|chrono/i,'chrono','Chrono des filières'],[/défi/i,'defis','Défis']],
  schemaDe:e=>{if(!e||!e.spec)return '';const h=schema(e.spec);return h?`<div class="schema-step">${h}</div>`:''},
  /* accueil et installation : des blocs d'information, sans fiche */
  plan(c,id){
    const s=sea(c,id);if(!s)return [];
    let fi=0;
    return s.tl.map(t=>{const typ=t[2],dur=+t[1];
      if(typ==='acc'||typ==='inst')return {k:'info',typ,label:t[0],court:typ==='acc'?'Accueil':'Install.',dur};
      const e=s.ex[fi],lab=(typ==='ex'||typ==='sf')&&e?court1(e.t):t[0];
      return {k:'ex',typ,ref:{c,id,i:fi++},label:lab,dur}})
     .map(x=>(x.orig=x.dur,x.st='todo',x));
  },
  blocInfo(b,s,i){const t=b.typ==='acc'?s.accueil:s.install;
    return `${t?`<h2 class="rub">${b.typ==='acc'?'Accueil':'Installation'}</h2>${orgHTML(t)}`:''}${i===0?`<h2 class="rub">Objectif de la séance</h2><p class="texte">${esc(s.obj)}</p>`:''}${s.pas&&i===0?`<h2 class="rub">Pas du jour</h2><p class="texte">${esc(s.pas)}</p>`:''}${s.prepare.length&&i===0?`<h2 class="rub">Ce que la séance prépare pour l’évaluation</h2><ul class="org">${s.prepare.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}`},
  bascule:s=>s&&s.bpm?`<span class="bascule" style="display:inline-grid;place-items:center">♪ ${esc(s.bpm)} BPM</span>`:''
};
</script>
<script src="ecran.js"></script>
</body>
</html>
