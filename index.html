<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f141a;--surface:#18202a;--ink:#e6ebf1;--muted:#9aa6b4;--line:#2d3845;--accent:#2dd4bf;--accent-soft:#12302d;--warn:#fb923c;--pD:#60a5fa;--pG:#fb923c;--ok:#4ade80;--chip:#222c38}}
:root[data-theme="dark"]{--bg:#0f141a;--surface:#18202a;--ink:#e6ebf1;--muted:#9aa6b4;--line:#2d3845;--accent:#2dd4bf;--accent-soft:#12302d;--warn:#fb923c;--pD:#60a5fa;--pG:#fb923c;--ok:#4ade80;--chip:#222c38}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{background:var(--accent);color:#fff;padding:14px 16px 0}
:root[data-theme="dark"] header.top, header.top{color:#fff}
@media (prefers-color-scheme: dark){header.top{background:#115e59}}
header.top h1{margin:0;font-size:20px;letter-spacing:.2px}
header.top p{margin:2px 0 10px;opacity:.9;font-size:13px}
nav#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:0}
nav#nav button{flex:none;border:0;background:rgba(255,255,255,.14);color:#fff;padding:8px 12px;border-radius:8px 8px 0 0;font:inherit;font-size:14px;cursor:pointer}
nav#nav button.on{background:var(--bg);color:var(--ink);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:21px;margin:8px 0 10px}
h3{font-size:17px;margin:20px 0 8px}
h4{margin:0;font-size:16px}
a{color:var(--accent)}
.small{font-size:13px}.muted{color:var(--muted)}
.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pill{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12.5px;margin:0 4px 4px 0}
.st-faite{background:#dcfce7;color:#14532d}.st-jour{background:#fef3c7;color:#78350f}.st-eval{background:#fee2e2;color:#7f1d1d}
.sgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media (max-width:760px){.sgrid{grid-template-columns:repeat(4,1fr)}}
.sbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 6px;text-align:left;cursor:pointer;font:inherit;min-width:0}
.sbtn b{display:block;font-size:16px}.sbtn small{display:block;font-size:11.5px;color:var(--muted);line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.sbtn.on{outline:2px solid var(--accent);background:var(--accent-soft)}
.sbtn.st-faite,.sbtn.st-jour,.sbtn.st-eval{color:inherit}.sbtn.st-faite b::after{content:" ✓";color:var(--ok)}.sbtn.st-jour b::after{content:" ●";color:var(--warn)}
.seance{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.obj{font-size:15.5px}
.tl{display:flex;gap:3px;margin:10px 0 4px;min-width:0}
.tlb{min-width:0;border:0;border-radius:6px;padding:6px 4px;color:#fff;font:inherit;font-size:11.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center}
.tlb span{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.t-acc,.t-inst{background:#64748b}.t-ech{background:#0891b2}.t-ex{background:#0f766e}.t-sf{background:#c2410c}.t-bil{background:#6d28d9}
@media (max-width:600px){.tlb span{display:none}}
.prep{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:10px 0}
.prep ul{margin:6px 0 0;padding-left:18px}
.note{background:var(--chip);border-radius:8px;padding:8px 10px}
.defi{background:#fff7ed;color:#9a3412;border-radius:8px;padding:6px 10px;margin:4px 0 8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .defi{background:#3a1d12;color:#fdba74}}
.fiche{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;overflow:hidden;break-inside:avoid-page}
.fiche header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fiche header h4{flex:1;min-width:180px}
.tag{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:700}
.dur{font-weight:700;color:var(--warn)}
.fiche p{margin:5px 0}.fiche ol{margin:4px 0;padding-left:20px}
.roles{border-left:3px solid var(--pD);padding-left:8px}
.ok{border-left:3px solid var(--ok);padding-left:8px}
.var{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13.5px}.var p{background:var(--chip);border-radius:6px;padding:6px 8px;margin:4px 0}
@media (max-width:600px){.var{grid-template-columns:1fr}}
.sch{float:right;width:46%;max-width:380px;margin:0 0 8px 12px}
@media (max-width:700px){.sch{float:none;width:100%;margin:6px 0}}
.sch-wide{margin-top:8px}
svg{max-width:100%;height:auto;color:var(--ink)}
.svgw{width:100%}
.sv-step{fill:var(--chip);stroke:var(--muted);stroke-width:1.2}.sv-step.off{opacity:.35}
.sv-zone{fill:none;stroke:var(--line);stroke-width:1.5}
.sv-prof{fill:var(--accent)}.sv-lw{fill:#fff;font-size:8px;font-weight:600}
.sv-l{fill:currentColor;font-size:8px}.sv-b{font-size:13px;font-weight:700}
.sv-ar{fill:none;stroke:var(--muted);stroke-width:1.5}.sv-dim{stroke:var(--muted);stroke-dasharray:3 2}
.sv-cell{fill:var(--chip);stroke:var(--line)}
.minipas{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.minipas svg{width:100%}
.minipas figure{margin:0;text-align:center}.minipas figcaption{font-size:12.5px;font-weight:600}
.bloc{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;background:var(--surface)}
.bloc-h{font-weight:700;margin-bottom:6px}
.phr{display:flex;gap:5px}
@media (max-width:640px){.phr{flex-wrap:wrap}.phr .ph{flex:1 1 40%!important}}
.ph{border-left:4px solid var(--fc);background:var(--chip);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.ph b{font-size:12px;color:var(--muted)}.ph small{color:var(--muted);font-size:11.5px}
.fam{border-left:5px solid var(--fc);padding-left:8px}
.pasgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
@media (max-width:400px){.pasgrid{grid-template-columns:1fr}}
.pas{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;break-inside:avoid}
.pas-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pas-b{display:grid;grid-template-columns:1fr;gap:4px}.pas-svg{max-width:300px;margin:0 auto;width:100%}.pas-svg svg{width:100%}
@media (max-width:400px){.pas-b{grid-template-columns:1fr}}
.tps{margin:0;padding-left:18px;font-size:13px}
.cx{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.cx th{text-align:left;width:92px;color:var(--muted);font-weight:600;vertical-align:top;padding:3px 4px}.cx td{padding:3px 4px;border-top:1px solid var(--line)}
.tab{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0;background:var(--surface)}
.tab th,.tab td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
.tab th{background:var(--chip)}
@media screen and (max-width:700px){.tab{display:block;overflow-x:auto;max-width:100%}}
.filgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.fil{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--fc,var(--accent));border-radius:10px;padding:10px 12px}
.fil h3{margin-top:2px}
.calc{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:8px 0}
.calc label{display:flex;flex-direction:column;font-size:13px;gap:3px}
.calc input,.calc select{font:inherit;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:110px}
.calc-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.calc-out div{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--fc,var(--accent));border-radius:10px;padding:8px 10px}
.calc-out small{display:block;color:var(--muted)}.calc-out b{font-size:24px}
.chrono{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;position:relative}
#ch-sch{max-width:640px;margin:12px auto 0}
.ch-tot{font-size:22px;font-variant-numeric:tabular-nums;color:var(--muted)}
.chgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:560px){.chgrid{grid-template-columns:1fr}}
.chf{border-radius:12px;padding:14px;background:var(--fc);color:#fff;transition:filter .3s}
.chf.rec{filter:saturate(.25) brightness(.9)}
.chf .chk{display:block;font-size:13px;opacity:.9}.chf small{display:block;font-weight:700;letter-spacing:.5px}
.chf b{font-size:clamp(40px,11vw,76px);font-variant-numeric:tabular-nums;line-height:1.05}
.ch-fc{margin-top:10px;background:var(--warn);color:#fff;font-weight:800;font-size:28px;border-radius:10px;padding:8px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.6}}
.timer{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.timer b{font-size:30px;font-variant-numeric:tabular-nums}.timer span{font-size:13px}
.ech .checks{columns:2;font-size:14px}
@media (max-width:520px){.ech .checks{columns:1}}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.cn td{height:44px}.lines{line-height:2}.pg p{overflow-wrap:anywhere}
.rpe td{font-size:12px;text-align:center}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cbtn{background:#fff;color:var(--accent);font-weight:700;border-radius:999px;padding:7px 14px;text-decoration:none;font-size:14px}
.hero{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:16px;margin:8px 0 14px}
.hero h2{margin-top:0}.btn.big{font-size:16px;padding:11px 16px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column}
.acard h3{margin:6px 0 4px;font-size:16px}.acard p{margin:4px 0}.acard .actions{margin-top:auto;padding-top:6px}
.acard-h{display:flex;justify-content:space-between;align-items:center}.anum{font-weight:800;font-size:20px;color:var(--accent)}
.dlist{display:flex;flex-wrap:wrap;gap:8px}
#printzone{display:none}
body.printmode #printzone{display:block;padding:0 8px}
@media print{
  @page{size:A4;margin:11mm}
  body{background:#fff;color:#000;font-size:10pt}
  :root{--surface:#fff;--ink:#000;--muted:#444;--line:#999;--chip:#f0f0f0;--accent-soft:#eef7f5}
  header.top,nav,main,.noprint,.timer{display:none!important}
  body.printmode main,body.printmode header.top{display:none!important}
  #printzone{display:block!important}
  .seance{border:0;padding:0;margin:0;break-before:page}
  .seance:first-child{break-before:auto}
  .fiche{break-inside:auto;border-color:#999}
  .fiche header{break-after:avoid}
  svg,figure,.bloc,.var,.ok,tr{break-inside:avoid}
  .minipas{grid-template-columns:repeat(4,1fr)}
  .pas-svg{max-width:210px}
  .pas{font-size:9.5pt;padding:6px}
  .tps{font-size:9pt}.cx{font-size:8.5pt}
  .tlb{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pg{border:0;padding:0;break-after:page}
  .pas{break-inside:avoid}
  .pasgrid{display:block}
  .pasgrid .pas{display:inline-block;width:49.2%;vertical-align:top;margin:0 0.6% 6px 0}
  .pas-b{grid-template-columns:44% 1fr}
  h3.fam{break-before:page}
  h3.fam:first-of-type{break-before:auto}
  .pas-svg{max-width:170px}
  .sch{width:42%}
  h2,h3,h4{break-after:avoid}
  a{color:#000;text-decoration:none}
  .cn td{height:52px}
}
</style>

<style id="appicon-css">.appicon{width:40px;height:40px;border-radius:9px;vertical-align:middle;margin:0 10px 0 0;box-shadow:0 1px 3px rgba(0,0,0,.25);flex:none;display:inline-block;object-fit:cover}

<style id="step-socle">
/* Step remis sur le socle commun des cycles (eps-design.css) :
   mêmes couleurs, mêmes polices, même en-tête, même minutage que volley, badminton, demi-fond, tennis de table. */
:root{--ink:var(--fg);--chip:var(--surface-2);--accent:#1f4fa8;--accent-soft:#e3ebf8;--accent-fg:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:var(--fg);--chip:var(--surface-2);--accent:#7aa5f0;--accent-soft:#1b2a44;--accent-fg:#0f1620}}
:root[data-theme="dark"]{--ink:var(--fg);--chip:var(--surface-2);--accent:#7aa5f0;--accent-soft:#1b2a44;--accent-fg:#0f1620}
body{line-height:1.5}

/* En-tête clair et compact, comme les autres cycles (plus de bandeau vert). */
header.top,:root[data-theme="dark"] header.top{background:transparent!important;color:var(--fg)!important;max-width:1100px;margin:0 auto;padding:14px 16px 0}
header.top p{color:var(--muted);opacity:1;font-size:var(--t-s);margin:6px 0 0}
.cbtn{display:inline-flex;align-items:center;min-height:40px;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);border-radius:10px;font-size:15px}
nav#nav{flex-wrap:wrap;overflow:visible;gap:6px;margin-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
nav#nav button{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600;min-height:42px}
nav#nav button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* Titres et boutons. */
h2{font-family:var(--font-display);font-size:clamp(28px,3.6vw,36px);line-height:1.05;text-wrap:balance}
h3{font-family:var(--font-display);font-size:22px;line-height:1.15}
.btn{display:inline-flex;align-items:center;min-height:44px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:10px;font-size:15px;font-weight:600}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.sgrid+.actions .btn{min-height:36px;font-size:var(--t-s);padding:4px 12px}
.pill{font-size:var(--t-s);padding:3px 10px}
.small{font-size:var(--t-s)}

/* Séances : mêmes boutons que dans les autres cycles. */
.sbtn{border:1.5px solid var(--line);min-height:52px;padding:8px 10px;border-radius:10px}
.sbtn b{font-family:var(--font-display);font-size:var(--t-l);line-height:1}
.sbtn{padding:8px}
.sbtn small{font-size:13px;white-space:normal;overflow:visible;text-overflow:clip;-webkit-hyphens:auto;hyphens:auto}
@media (max-width:700px){nav#nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}nav#nav button{flex:none}.sbtn small{font-size:13px}}
.sbtn.on{outline:0;background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.sbtn.on small{color:var(--accent-fg);opacity:.85}
.anum{font-family:var(--font-display);font-size:28px}
.acard h3{font-size:22px}
.hero{border-left-color:var(--sport)}

/* Minutage : le contenu de chaque bloc est toujours écrit, la durée en gros. */
.obj{font-size:17px}
.tl{flex-wrap:wrap;gap:6px}
.tlb{min-width:104px;align-items:flex-start;justify-content:flex-start;text-align:left;gap:2px;padding:8px 12px;border-radius:10px;font-size:var(--t-s);line-height:1.25}
.tlb b{order:-1;font-family:var(--font-display);font-size:26px;line-height:1;white-space:nowrap}
.tlb span{display:block!important;white-space:normal!important;overflow:visible!important}

/* Fiches d'exercice. */
.fiche h4{font-family:var(--font-display);font-size:24px;line-height:1.1}
.fiche .tag{font-size:13px}
.dur{font-size:var(--t-s)}
.fiche p,.fiche li{font-size:16.5px}
.var{font-size:15px}
.ph b,.ph small,.cx,.minipas figcaption,.tps{font-size:var(--t-s)}
.tab{font-size:15px}
.calc-out b,.kpi b{font-family:var(--font-display)}

/* Mode gymnase. */
body.gym header.top p,body.gym .actions:has([data-print]){display:none!important}
body.gym .seance h2{font-size:clamp(34px,5vw,44px)}

body.gym .tlb{min-width:140px;font-size:16px}

body.gym .fiche p,body.gym .fiche li{font-size:19px}
body.gym .sch{float:none;width:100%;max-width:600px;margin:8px 0}
body.gym nav#nav button,body.gym .sbtn{min-height:56px}
</style>

<body>
<header class="top"><div class="toprow"><h1><img class="appicon" src="icon-192.png" alt="" width="40" height="40">Cycle Step · CA5 · Seconde</h1><a class="cbtn" href="https://yannickdartois-hue.github.io/Carnet-Step-/">📱 Carnet élève</a></div><p>Lycée G. Pompidou · 8 séances de 70 min · 35 élèves · gymnase de type C</p><nav id="nav" aria-label="Sections"></nav></header>
<main id="main"></main>
<div id="printzone"></div>
<script>
/* ================== DONNÉES DU CYCLE STEP CA5 — SECONDE ================== */
const DUREE = 70;

/* ---------- Répertoire des 16 pas ---------- */
/* pos : [temps, pied, x, y, marque] — marque : "" appui, "e" élévation (pied en l’air), "t" touche sans poids */
const FAMILLES = {
  F1:{nom:"Face au step · gardent le pied directeur", c:"#2563eb"},
  F2:{nom:"Élévations · changent de pied directeur", c:"#7c3aed"},
  F3:{nom:"Traverser le step", c:"#0d9488"},
  F4:{nom:"Tourner", c:"#c2410c"}
};
const PAS = [
 {id:1, nom:"Basique", fam:"F1", tps:4, pied:"Garde le même pied directeur",
  desc:["Monte pied droit au centre du step","Monte pied gauche à côté","Descends pied droit derrière, à 20 cm du step","Assemble pied gauche"],

function svgPas(p, w){
  const W = w || 200;

  let s = `<svg viewBox="0 0 200 120" width="${W}" role="img" aria-label="Placement des pieds : ${esc(p.nom)}" class="svgpas">`;
  s += `<text x="4" y="9" class="sv-l">↑ côté sono</text>`;
  s += `<rect x="50" y="45" width="100" height="30" rx="4" class="sv-step"/>`;
  if(prof){ s += `<path d="M150 108 l18 0 m-6 -5 l6 5 l-6 5" class="sv-ar"/><text x="148" y="111" class="sv-l" text-anchor="end">regard</text>`; }
  else { s += `<path d="M176 112 l0 -16 m-5 6 l5 -6 l5 6" class="sv-ar"/><text x="171" y="118" class="sv-l" text-anchor="end">regard</text>`; }
  const map = {};
  p.pos.forEach(q => { const k = q[1]+q[2]+"_"+q[3]+"_"+(q[4]||""); (map[k] = map[k] || {f:q[1],x:q[2],y:q[3],m:q[4]||"",t:[]}).t.push(q[0]); });
  Object.values(map).forEach(o => {
    const col = o.f === "D" ? "var(--pD)" : "var(--pG)";
    if(o.m === "e") s += `<ellipse cx="${o.x}" cy="${o.y}" rx="5.5" ry="7.5" fill="none" stroke="${col}" stroke-width="1.6" stroke-dasharray="3 2"/>`;
    else if(o.m === "t") s += `<ellipse cx="${o.x}" cy="${o.y}" rx="5.5" ry="7.5" fill="var(--surface)" stroke="${col}" stroke-width="1.6"/>`;
    else s += `<ellipse cx="${o.x}" cy="${o.y}" rx="5.5" ry="7.5" fill="${col}"/>`;
    const lab = o.t.join("·");
    const fill = o.m ? col : "#fff";
    if(lab.length > 2){
      const right = o.f === "D";
      s += `<text x="${o.x + (right ? 8 : -8)}" y="${o.y+3}" text-anchor="${right ? "start" : "end"}" font-size="8" font-weight="700" fill="${col}">${lab}</text>`;
    } else s += `<text x="${o.x}" y="${o.y+3}" text-anchor="middle" font-size="${lab.length > 1 ? 6.5 : 8}" font-weight="700" fill="${fill}">${lab}</text>`;
  });
  s += `<g class="sv-l"><circle cx="12" cy="104" r="4" fill="var(--pD)"/><text x="19" y="107">D</text><circle cx="33" cy="104" r="4" fill="var(--pG)"/><text x="40" y="107">G</text>`;
  s += `<ellipse cx="12" cy="115" rx="3" ry="4" fill="none" stroke="currentColor" stroke-dasharray="2 1.5"/><text x="19" y="118">en l’air</text></g><g class="sv-l"><ellipse cx="104" cy="6" rx="3" ry="4" fill="none" stroke="currentColor"/><text x="110" y="9">touche sans poids</text></g>`;
  return s + `</svg>`;
}

    s += `<circle cx="${130 + exB[c.k]*30 + 13}" cy="${y+8}" r="6" fill="none" stroke="${FILIERES.B.c}" stroke-width="2" stroke-dasharray="3 2"/>`;

}
function htmlBloc(id){
  const b = BLOCS.find(x => x.id === id); let c = 0;
  return `<div class="bloc"><div class="bloc-h">${esc(b.nom)} <span class="muted">· départ : ${esc(b.depart)} · 32 temps</span></div><div class="phr">` +

    `</div><p class="small muted">${esc(b.fin)}</p></div>`;

function schema(spec){
  if(!spec) return "";
  const [t, a] = spec.split(":");
  if(t === "salle") return svgSalle();
  if(t === "binome") return svgBinome();
  if(t === "curseurs") return svgCurseurs();
  if(t === "series") return svgSeries(a.split(",").map(Number), a === "12" || a === "6,3" ? 1 : 2);
  if(t === "filieres") return svgFiliere(a);
  if(t === "pas") return `<div class="minipas">` + a.split(",").map(n => { const p = pasById(+n); return `<figure>${svgPas(p,140)}<figcaption>${p.id}. ${esc(p.nom)}</figcaption></figure>`; }).join("") + `</div>`;
  if(t === "bloc") return a.split(",").map(n => htmlBloc(+n)).join("");
  return "";
}

function statut(i){
  const today = LS.get("step2de_jour", -1);
  if(i === 7 && today !== 7) return ["eval","Évaluation"];
  if(today < 0) return ["avenir","À venir"];
  if(i < today) return ["faite","Faite"];
  if(i === today) return ["jour","Aujourd’hui"];
  return ["avenir","À venir"];
}

}

VIEWS.defis = () => `<h2>Défis (à partir de S3)</h2>

VIEWS.banque = () => `<h2>Banque de formes de travail</h2>
  <p>Pour remplacer une situation ou prolonger le cycle. Niveaux N1 (débutant) à N3.</p>
  <table class="tab"><tr><th>Forme</th><th>Filière</th><th>Niveau</th><th>Format</th><th>Effet recherché</th><th>Remplace</th></tr>${BANQUE.map(b => `<tr><th>${esc(b.nom)}</th><td>${b.fil}</td><td>${b.niv}</td><td>${esc(b.format)}</td><td>${esc(b.effet)}</td><td>${esc(b.remplace)}</td></tr>`).join("")}</table>
  <div class="actions noprint"><a class="btn ghost" href="pdf/2de-step-banque.pdf">PDF</a></div>`;
VIEWS.diff = () => `<h2>Différenciation</h2>
  <div class="filgrid">
  <article class="fil"><h3>Élève en difficulté de coordination</h3><ul><li>Faire chaque pas 8 temps au sol avant le step.</li><li>Garder le même pas 8 temps (2 fois) au lieu de 4.</li><li>Remplacer les pas de profil par des pas de face.</li><li>Se placer au 1er rang, face à l’enseignant.</li></ul></article>
  <article class="fil"><h3>Élève à l’aise</h3><ul><li>Bras dissociés (bras/bras ou bras/jambes).</li><li>Pas avancés de l’équipe (pendule, reverse, T step) en remplacement.</li><li>Meneur de rangée à l’échauffement.</li><li>Filière A : 4e série si FC de reprise sous 120.</li></ul></article>
  <article class="fil"><h3>Aptitude partielle (genou, dos, cheville)</h3><ul><li>Pas de filière A (sauf avis médical favorable).</li><li>Step sans réhausse, bande de moquette ou zone au sol de la taille du step.</li><li>Aucun saut ; leviers bras et amplitude seulement.</li><li>Zone de FC fixée selon l’avis médical (référentiel adapté de Grenoble).</li></ul></article>
  <article class="fil"><h3>Élève dispensé</h3><ul><li>Gestion du chrono et de la sono.</li><li>Coach supplémentaire avec fiche coach.</li><li>Observateur sécurité (pied entier, descente arrière).</li><li>Distribution et récupération des oxymètres.</li></ul></article></div>`;
VIEWS.reperes = () => `<h2>Repères de spécialiste</h2>
  <h3>Sécurité</h3><ul><li>Chaussures obligatoires, jamais pieds nus.</li><li>Pied entier posé à plat au centre ; jambe d’appui légèrement fléchie à la réception ; pas de bruit.</li><li>On ne descend jamais en avant, on ne monte jamais en arrière, on ne saute jamais en descendant.</li><li>1 m de vide autour de chaque step ; on reste près de son step à la descente.</li><li>Rotation : alléger l’appui, le regard précède.</li><li>Douleur au genou ou au dos : version basse, pas de filière A.</li></ul>
  <h3>Musique</h3><ul><li>Morceaux phrasés en 32 temps (« step music 128-132 BPM »). 125-128 BPM en S1, 130-132 BPM ensuite. Au-dessus de 135 BPM, la pose du pied entier devient difficile pour des débutants.</li><li>Gymnase de type C, grand volume : regrouper les steps sur une moitié, sono orientée vers les élèves, enceinte surélevée. Un micro-casque évite de crier par-dessus la musique.</li></ul>
  <h3>Guidage (cueing)</h3><ul><li>Annoncer le pas suivant pendant les 4 derniers temps (« 4, 3, V step, go »).</li><li>En miroir : l’enseignant fait le côté opposé pour que les élèves partent du bon pied.</li><li>Gestes : doigts levés = nombre de répétitions ; pouce derrière l’épaule = on recommence ; doigt qui tourne = tour ; V avec les doigts = V step.</li><li>Remplacer peu à peu la parole par les gestes.</li></ul>
  <h3>Repères d’entraînement</h3><table class="tab"><tr><th></th><th>Grenoble</th><th>Strasbourg 2025</th><th>Ce cycle (2de)</th></tr><tr><th>Bref et intense</th><td>&gt; 85 % FCR, 14-22 min, séries ≤ 4 min</td><td>&gt; 180 bpm, séries ≤ 3 min</td><td>80-95 % FCR, 4 × 4 min, r 3 min</td></tr><tr><th>Long et soutenu</th><td>70-85 % FCR, 20-26 min</td><td>160-180 bpm</td><td>— (non retenu en 2de)</td></tr><tr><th>Modéré et prolongé</th><td>50-65 % FCR, 25-30 min</td><td>&lt; 160 bpm, séries &gt; 7 min</td><td>55-70 % FCR, 2 × 10 min, r 5 min</td></tr><tr><th>Tempo</th><td>130-145 BPM</td><td>128-135 BPM</td><td>130-132 BPM</td></tr></table>
  <h3>Sources</h3><ul>${SOURCES.map(s => `<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}<li>Chorégraphie et routine d’échauffement de l’équipe ; dossier du stage step 2007 (I. Boulnois, P. Kogut) pour les définitions de pas.</li><li>Documents d’Edith (cycle step 2nde, formule de Karvonen, carnet de suivi) et documents de l’équipe (routine d’échauffement, blocs).</li></ul>`;

/* ---------- Navigation ---------- */
const TABS = [["accueil","Accueil"],["seances","Séances"],["pas","16 pas"],["blocs","Blocs et curseurs"],["fc","Filières et FC"],["chrono","Chrono"],["echauff","Échauffements"],["carnet","Carnet"],["defis","Défis"],["eval","Évaluation"],["banque","Banque"],["diff","Différenciation"],["reperes","Repères et sources"]];
let curTab = LS.get("step2de_tab2","accueil");
function render(){
  $("#nav").innerHTML = TABS.map(t => `<button class="${t[0]===curTab?"on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("");
  $("#main").innerHTML = (VIEWS[curTab] || VIEWS.seances)();
  if(curTab === "fc") calc();
  if(curTab === "chrono") chronoInit();
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ curTab = b.dataset.tab; LS.set("step2de_tab2", curTab); stopChrono(); render(); window.scrollTo(0,0); }
  else if(b.dataset.openS !== undefined){ curSeance = +b.dataset.openS; curTab = "seances"; LS.set("step2de_tab2", curTab); render(); window.scrollTo(0,0); }
  else if(b.dataset.s !== undefined){ curSeance = +b.dataset.s; render(); }
  else if(b.dataset.today !== undefined){ LS.set("step2de_jour", +b.dataset.today); render(); }
  else if(b.dataset.print){ doPrint(b.dataset.print); }
  else if(b.classList.contains("tlb")){ startTimer(+b.dataset.min, b.dataset.lab); }
  else if(b.id === "tm-close"){ stopTimer(); }
  else if(b.id === "ch-go"){ toggleChrono(); }
  else if(b.id === "ch-rst"){ resetChrono(); }
  else if(b.id === "go-today"){ const t = LS.get("step2de_jour",-1); if(t >= 0){ curSeance = t; curTab = "seances"; render(); } }
});
document.addEventListener("input", e => { if(e.target.closest(".calc") && curTab === "fc") calc(); });
document.addEventListener("change", e => { if(e.target.id === "ch-fmt") resetChrono(); if(e.target.closest(".calc") && curTab === "fc") calc(); });

/* ---------- Calculateur ---------- */
function zones(age, sexe, rep){
  const max = (sexe === "G" ? 220 : 226) - age, fcr = max - rep;
  const z = p => Math.round(rep + fcr*p/100);
  return {max, fcr, A:[z(80), z(95)], B:[z(55), z(70)]};
}
function calc(){
  const age = +$("#c-age").value || 15, sexe = $("#c-sexe").value, rep = +$("#c-rep").value || 70;
  const z = zones(age, sexe, rep);
  $("#c-out").innerHTML = `<div><small>FC max</small><b>${z.max}</b></div><div><small>FC de réserve</small><b>${z.fcr}</b></div><div style="--fc:${FILIERES.A.c}"><small>Zone A</small><b>${z.A[0]}-${z.A[1]}</b></div><div style="--fc:${FILIERES.B.c}"><small>Zone B</small><b>${z.B[0]}-${z.B[1]}</b></div>`;
}
function tableFC(){
  let h = `<div class="pg"><h3>Table des zones de FC · Step 2de</h3><p class="small">Zone A = 80 à 95 % de la FC de réserve · Zone B = 55 à 70 % · FC max = 220 − âge (garçons), 226 − âge (filles).</p>`;
  [15,16].forEach(age => {
    h += `<table class="tab ft"><tr><th rowspan="2">FC repos</th><th colspan="2">Filles ${age} ans</th><th colspan="2">Garçons ${age} ans</th></tr><tr><th>Zone A</th><th>Zone B</th><th>Zone A</th><th>Zone B</th></tr>`;
    for(let r=50;r<=95;r+=5){ const f = zones(age,"F",r), g = zones(age,"G",r); h += `<tr><th>${r}</th><td>${f.A.join("-")}</td><td>${f.B.join("-")}</td><td>${g.A.join("-")}</td><td>${g.B.join("-")}</td></tr>`; }
    h += `</table>`;
  });
  return h + `</div>`;
}

/* ---------- Minuteur de frise ---------- */
let tmInt = null;
function beep(f, d){ try{ const C = window.AudioContext || window.webkitAudioContext; window._ac = window._ac || new C(); const o = _ac.createOscillator(), g = _ac.createGain(); o.frequency.value = f; o.connect(g); g.connect(_ac.destination); g.gain.value = .25; o.start(); o.stop(_ac.currentTime + d); }catch(e){} }
const mmss = s => String(Math.floor(s/60)).padStart(2,"0") + ":" + String(Math.max(0,s%60)).padStart(2,"0");
function startTimer(min, lab){
  stopTimer(); let s = min*60;
  const el = document.createElement("div"); el.id = "timer"; el.className = "timer";
  el.innerHTML = `<span id="tm-l">${esc(lab)}</span><b id="tm-v">${mmss(s)}</b><button class="btn ghost" id="tm-close">Fermer</button>`;
  document.body.appendChild(el);
  tmInt = setInterval(() => { s--; const v = $("#tm-v"); if(v) v.textContent = mmss(s); if(s === 60) beep(660,.2); if(s <= 0){ beep(880,.8); clearInterval(tmInt); } }, 1000);
}
function stopTimer(){ clearInterval(tmInt); const t = $("#timer"); if(t) t.remove(); }

/* ---------- Chrono des filières ---------- */
let CH = {run:false, t:0, int:null, fmt:"eval"};
function segs(k, fmt){
  const F = FORMATS[fmt][k], out = []; let t = 0;
  F.e.forEach((d,i) => { out.push({type:"E", n:i+1, a:t, b:t+d*60}); t += d*60; if(i < F.e.length-1 && F.r){ out.push({type:"R", n:i+1, a:t, b:t+F.r*60}); t += F.r*60; } });
  return out;
}
function measurePoints(fmt){
  const pts = [];
  ["A","B"].forEach(k => segs(k, fmt).forEach(s => { if(s.type === "E"){ pts.push(s.b); if(k === "B") pts.push(Math.round((s.a+s.b)/2)); } }));
  return pts;
}
function chronoInit(){ CH.fmt = $("#ch-fmt").value; $("#ch-fmt").value = CH.fmt; drawChrono(); $("#ch-sch").innerHTML = svgFiliere(CH.fmt); }
function drawChrono(){
  const tot = $("#ch-tot"); if(!tot) return;
  tot.textContent = mmss(CH.t);
  let fc = false;
  ["A","B"].forEach(k => {
    const S = segs(k, CH.fmt), end = S[S.length-1].b;
    const cur = S.find(s => CH.t >= s.a && CH.t < s.b);
    let h;
    if(!cur) h = CH.t >= end ? `<b>Terminé</b>` : `<b>Prêt</b>`;
    else h = `<small>${cur.type === "E" ? "EFFORT " + cur.n + " / " + FORMATS[CH.fmt][k].e.length : "RÉCUPÉRATION ACTIVE"}</small><b>${mmss(cur.b - CH.t)}</b>`;
    $("#ch-"+k).innerHTML = `<span class="chk">${FILIERES[k].nom}</span>${h}`;
    $("#ch-"+k).classList.toggle("rec", !!cur && cur.type === "R");
  });
  measurePoints(CH.fmt).forEach(p => { if(CH.t >= p && CH.t < p + 15) fc = true; });
  $("#ch-fc").hidden = !fc;
}
function tick(){
  CH.t++;
  const ch = new Set(); ["A","B"].forEach(k => segs(k, CH.fmt).forEach(s => ch.add(s.b)));
  const pts = measurePoints(CH.fmt);
  if([...ch].some(b => b - CH.t > 0 && b - CH.t <= 3) || pts.some(p => p - CH.t > 0 && p - CH.t <= 3)) beep(660,.12);
  if(ch.has(CH.t) || pts.includes(CH.t)) beep(990,.6);
  const end = Math.max(...["A","B"].map(k => { const S = segs(k, CH.fmt); return S[S.length-1].b; }));
  if(CH.t >= end){ stopChrono(); beep(990,1.2); }
  drawChrono();
}
let wake = null;
function toggleChrono(){
  if(CH.run){ stopChrono(); return; }
  CH.run = true; CH.int = setInterval(tick, 1000); beep(880,.2);
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(w => wake = w).catch(()=>{}); }catch(e){}
  $("#ch-go").textContent = "Pause";
}
function stopChrono(){ clearInterval(CH.int); CH.run = false; const g = $("#ch-go"); if(g) g.textContent = "Reprendre"; try{ if(wake) wake.release(); }catch(e){} }
function resetChrono(){ stopChrono(); CH.t = 0; const g = $("#ch-go"); if(g) g.textContent = "Démarrer"; chronoInit(); }

/* ---------- Impression ---------- */
function printContent(kind){
  if(/^S\d$/.test(kind)) return seanceHTML(SEANCES.findIndex(s => s.id === kind), true);
  if(kind === "cycle"){
    const som = `<section class="seance"><h2>Cycle Step CA5 · Seconde · 8 séances de 70 min</h2><table class="tab"><tr><th>Séance</th><th>Titre</th><th>BPM</th></tr>${SEANCES.map(S => `<tr><th>${S.id}</th><td>${esc(S.titre)}</td><td>${S.bpm}</td></tr>`).join("")}</table><p class="small">Filière A : 4 × 4 min, r 3 min, 80-95 % FCR. Filière B : 2 × 10 min, r 5 min, 55-70 % FCR. Les deux formats durent 25 min.</p>${svgSalle()}</section>`;
    return som + SEANCES.map((S,i) => seanceHTML(i, true)).join("");
  }
  if(kind === "pas") return `<section>${VIEWS.pas()}</section>`;
  if(kind === "carnet") return carnetHTML();
  if(kind === "coach") return coachHTML() + coachHTML();
  if(kind === "echauff") return `<div class="pg"><h3>Échauffement autonome en binôme</h3>${echauffFiche()}</div>`;
  if(kind === "eval") return `<div class="pg"><h2>Évaluation Step CA5 · Seconde · /20</h2>${evalHTML()}</div>`;
  if(kind === "table") return tableFC();
  if(kind === "perso") return persoHTML();
  if(kind === "banque") return `<section>${VIEWS.banque()}</section>`;
  if(kind === "defis") return `<div class="pg"><h2>Défis du cycle step · S3 à S8</h2>${defisHTML()}</div>`;
  return "";
}
function doPrint(kind){
  $("#printzone").innerHTML = printContent(kind);
  document.body.classList.add("printing");
  setTimeout(() => { window.print(); document.body.classList.remove("printing"); $("#printzone").innerHTML = ""; }, 60);
}

/* ---------- Démarrage ---------- */
(function(){
  const q = new URLSearchParams(location.search).get("print");
  if(q){ document.body.classList.add("printmode"); $("#printzone").innerHTML = printContent(q); return; }
  render();
})();

if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
